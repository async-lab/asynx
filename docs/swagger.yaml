                type: string
            type: object
        "500":
          description: 服务器内部错误
          schema:
            properties:
              data:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: 更改账号角色
      tags:
      - users
  /users/category:
    patch:
      consumes:
      - application/json
      description: 批量修改指定用户的账号类型。需要 ADMIN 角色权限。
      parameters:
      - description: 批量修改账号类型请求
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/controller.RequestBatchModifyCategory'
      produces:
      - application/json
      responses:
        "200":
          description: 全部成功：批量修改结果
          schema:
            properties:
              data:
                $ref: '#/definitions/controller.BatchModifyResult'
            type: object
        "207":
          description: 部分失败：批量修改结果
          schema:
            properties:
