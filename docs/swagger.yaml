              data:
                type: string
            type: object
        "403":
          description: 权限不足
          schema:
            properties:
              data:
                type: string
            type: object
        "500":
          description: 服务器内部错误
          schema:
            properties:
              data:
                type: string
            type: object
      security:
      - BearerAuth: []
      summary: 批量修改角色权限
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: 输入 Bearer Token，格式为 "Bearer <token>"
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
